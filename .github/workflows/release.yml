name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: darwin
            arch: amd64
            runner: macos-13
          - os: linux
            arch: amd64
            runner: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Extract Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build CodeFlow & Adapter
        run: |
          mkdir -p dist/bin dist/skills
          go build -trimpath -ldflags="-s -w" -o dist/bin/codeflow ./cmd/codeflow
          dart compile exe adapters/dart/bin/codeflow_dart_adapter.dart -o dist/bin/dart-adapter
          cp -R skills/codeflow dist/skills/
          
          ASSET_NAME="codeflow-${{ steps.get_version.outputs.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czvf "$ASSET_NAME" -C dist bin skills
          shasum -a 256 "$ASSET_NAME" > "${ASSET_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeflow-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            codeflow-*.tar.gz
            codeflow-*.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums Manifest
        run: |
          cd release-assets
          cat *.sha256 > checksums.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/checksums.txt
          generate_release_notes: true
