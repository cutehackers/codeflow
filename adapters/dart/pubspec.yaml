name: codeflow_dart_adapter
description: >-
  CodeFlow v2 Dart language adapter. Speaks the CORE adapter protocol
  (Content-Length framed JSON-RPC over stdio): initialize, detect,
  harvest_candidates, slice, shutdown.
  Parses immutable snapshot source with the Dart analyzer.
version: 0.4.0
environment:
  sdk: ^3.11.0
executables:
  codeflow_dart_adapter:
dependencies:
  analyzer: ^14.1.0
dev_dependencies:
  test: ^1.24.0
